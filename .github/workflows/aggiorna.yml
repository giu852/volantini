name: Aggiorna offerte
on:
  schedule:
    - cron: "30 5 * * *"   # ogni giorno, 06:30/07:30 ora italiana
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 playwright
      - run: playwright install --with-deps chromium
      - run: python scraper/run.py
      - run: |
          git config user.name "offerte-bot"
          git config user.email "offerte-bot@users.noreply.github.com"
          git add web/data/offerte.json
          git diff --cached --quiet || (git commit -m "Aggiorna offerte" && git push)
